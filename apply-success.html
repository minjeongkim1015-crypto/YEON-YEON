<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>신청 완료 | 연:연</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root{
      --bg:#f7f5f2;
      --surface:#ffffff;
      --border:#e8e4de;
      --ink:#111111;
      --muted:#777;
      --lime:#7dd600;
      --pink:#ff3d7f;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      background:linear-gradient(180deg,#faf8f5 0%, #f7f5f2 100%);
      color:var(--ink);
      font-family:'Pretendard',sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card{
      width:min(100%, 760px);
      background:rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:28px;
      padding:48px 40px;
      box-shadow:0 20px 60px rgba(17,17,17,0.08);
      backdrop-filter:blur(10px);
      position:relative;
      overflow:hidden;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      background:#f0ffd4;
      color:#4a8a00;
      border:1px solid #d9f3a8;
      border-radius:999px;
      padding:8px 14px;
      font-size:13px;
      font-weight:600;
      margin-bottom:24px;
    }
    .dot{
      width:8px;height:8px;border-radius:50%;background:var(--lime);
      box-shadow:0 0 0 6px rgba(125,214,0,0.14);
    }
    h1{
      font-size:clamp(34px, 6vw, 56px);
      line-height:1.06;
      letter-spacing:-1.2px;
      margin-bottom:18px;
    }
    h1 .accent{color:var(--pink);}
    .desc{
      font-size:17px;
      line-height:1.8;
      color:var(--muted);
      margin-bottom:28px;
    }
    .name{
      font-weight:700;
      color:var(--ink);
    }
    .box{
      background:#fff;
      border:1px solid var(--border);
      border-radius:18px;
      padding:20px 22px;
      margin-bottom:28px;
    }
    .box p{
      font-size:15px;
      line-height:1.8;
      color:#555;
    }
    .actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:170px;
      height:52px;
      padding:0 22px;
      border-radius:14px;
      text-decoration:none;
      font-weight:700;
      transition:transform .2s ease, box-shadow .25s ease, opacity .2s ease;
    }
    .btn:hover{transform:translateY(-1px);}
    .btn-primary{
      background:var(--ink);
      color:#fff;
      box-shadow:0 14px 30px rgba(17,17,17,0.14);
    }
    .btn-secondary{
      background:#fff;
      color:var(--ink);
      border:1px solid var(--border);
    }
    .shape{
      position:absolute;
      border-radius:999px;
      opacity:.9;
      pointer-events:none;
    }
    .shape.one{
      width:180px;height:180px;
      background:radial-gradient(circle, rgba(125,214,0,0.16), rgba(125,214,0,0));
      top:-40px;right:-40px;
    }
    .shape.two{
      width:220px;height:220px;
      background:radial-gradient(circle, rgba(255,61,127,0.10), rgba(255,61,127,0));
      bottom:-80px;left:-80px;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDUxI7p43u7eDh9z19XXMRUb-ZTsLAtRj8",
      authDomain: "yeon-yeon.firebaseapp.com",
      projectId: "yeon-yeon",
      storageBucket: "yeon-yeon.firebasestorage.app",
      messagingSenderId: "226229603529",
      appId: "1:226229603529:web:a912737eb0846e9e831118",
      measurementId: "G-D87HFKRP4Z"
    };

    let db = null;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      window._applySuccessDb = db;
      window._applySuccessFns = { collection, addDoc };
    } catch (error) {
      console.error("apply-success Firebase init 실패:", error);
    }
  </script>

</head>
<body>
  <div class="card">
    <div class="shape one"></div>
    <div class="shape two"></div>

    <div class="badge"><span class="dot"></span> 신청이 정상적으로 접수되었어요</div>

    <h1><span class="name" id="userName">고객</span>님,<br>연:연에 <span class="accent">신청 완료</span></h1>

    <p class="desc">
      입력해주신 정보를 바탕으로 검토 후 안내드릴게요.<br>
      보통 24시간 이내에 연락드려요.
    </p>

    <div class="box">
      <p>
        연:연은 조건보다 사람을 먼저 봅니다.<br>
        잘 맞는 인연이 닿을 수 있도록 정성껏 살펴볼게요.
      </p>
    </div>

    <div class="actions">
      <a class="btn btn-primary" href="index.html">메인으로 돌아가기</a>
      <a class="btn btn-secondary" href="index.html#profiles">인연 리스트 보기</a>
    </div>
  </div>

  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const name = params.get('name') || '';
      const birthDate = params.get('birthDate') || '';
      const gender = params.get('gender') || '';
      const job = params.get('job') || '';
      const contact = params.get('contact') || '';

      if (name) {
        document.getElementById('userName').textContent = decodeURIComponent(name);
      }

      // Prevent duplicate saves when user refreshes apply-success page
      const saveKey = [name, birthDate, gender, job, contact].join('|');
      if (!name || sessionStorage.getItem('applySavedKey') === saveKey) {
        return;
      }

      const createdAt = Date.now();
      const payload = { name, birthDate, gender, job, contact, createdAt };

      let age = '';
      if (birthDate) {
        const birth = new Date(birthDate);
        const today = new Date();
        age = today.getFullYear() - birth.getFullYear();
        const monthDiff = today.getMonth() - birth.getMonth();
        if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
          age--;
        }
      }

      const colors = ['#edffd4', '#fff0f5', '#f0f5ff', '#f0faf5'];
      const bgColor = colors[Math.floor(Math.random() * colors.length)];
      const textColor =
        bgColor === '#edffd4' ? '#c8ff0055' :
        bgColor === '#fff0f5' ? '#ff4d8d33' :
        bgColor === '#f0f5ff' ? '#7eaaff33' :
        '#70d6a044';

      const pendingProfile = {
        name,
        age,
        birthDate,
        gender,
        job: job || '직업 미입력',
        location: '상담 후 입력 예정',
        tags: '직접 시작하기,검토 대기',
        intro: '직접 시작하기 폼을 통해 접수된 신청자입니다. 관리자 검토 후 프로필이 정리됩니다.',
        badge: 'NEW',
        bgColor,
        textColor,
        contact,
        createdAt
      };

      try {
        const existing = JSON.parse(localStorage.getItem('applySubmissions') || '[]');
        existing.push(payload);
        localStorage.setItem('applySubmissions', JSON.stringify(existing));

        const pendingCards = JSON.parse(localStorage.getItem('pendingCards') || '[]');
        pendingCards.push(pendingProfile);
        localStorage.setItem('pendingCards', JSON.stringify(pendingCards));

        if (window._applySuccessDb && window._applySuccessFns) {
          try {
            await window._applySuccessFns.addDoc(
              window._applySuccessFns.collection(window._applySuccessDb, 'pendingCards'),
              pendingProfile
            );
          } catch (firebaseError) {
            console.error('apply-success Firebase 저장 실패:', firebaseError);
          }
        }

        sessionStorage.setItem('applySavedKey', saveKey);
      } catch (error) {
        console.error('apply-success 저장 실패:', error);
      }
    })();
  </script>
</body>
</html>
